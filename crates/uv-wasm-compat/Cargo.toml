[package]
name = "uv-wasm-compat"
version = "0.0.70"
description = "This is an internal component crate of uv"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anstream = { workspace = true }
futures = { workspace = true }
rustc-hash = { workspace = true }
web-time = { version = "1.1.0" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.45.1", default-features = false, features = ["process", "rt", "time"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = { version = "0.3" }
tokio = { version = "1.45.1", default-features = false, features = ["rt"] }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }

[dev-dependencies]
tokio = { version = "1.45.1", default-features = false, features = ["macros", "rt", "time"] }
